function resumeReply(id){const contact=replies.find(x=>x.id===id);if(!contact)return;modal('开启自动回复 · '+contact.name,'此操作会让该联系人重新进入自动回复。演示稿只更新模拟状态。',[{label:'取消'},{label:'开启自动回复',primary:true,onClick:()=>{contact.state='sent';contact.reason='';contact.preview=contact.messages[0]?.text||'';render();toast('已演示开启自动回复')}}])}
function renderReply(){
  const visible=replies.filter(r=>matching(r.name+' '+r.preview+' '+r.messages.map(m=>m.text).join(' '),r.at,r.kind,r.state));
  const totalPages=Math.max(1,Math.ceil(visible.length/3));
  ui.page=Math.min(ui.page,totalPages-1);
  const list=visible.slice(ui.page*3,ui.page*3+3);
  let html=`<section class="section"><div class="section-header"><div><h2>自动回复 <span class="count">${visible.length}</span></h2><p>按联系人查看执行内容 · 演示每页 3 位，正式页面每页最多 25 位</p></div></div><div class="section-body">`;
  html+=list.map((r,i)=>{
    const opened=ui.expanded.has(r.id);
    const history=r.messages.length?`<div class="history-list">${r.messages.map(m=>`<div class="message" tabindex="0" data-record-id="${esc(m.id)}" title="右键管理这条记录"><time>${date(m.at)}</time><p class="record-text">${esc(m.text)}</p><span class="state ${m.status==='已回复'?'green':'amber'}">${esc(m.status)}</span></div>`).join('')}</div>`:'<div class="history-list"><p class="empty">当前可读取范围内暂无正文，可以打开聊天查看。</p></div>';
    const ranges=[['takeover','本次接管'],['all','全部'],['day','近一天'],['week','近一周'],['month','近一月']].map(([value,label])=>`<option value="${value}" ${ui.summaryRange[r.id]===value?'selected':''}>${label}</option>`).join('');
    return `<article class="record ${opened?'open':''}"><div class="record-summary"><div class="person"><span class="avatar ${avClass(i)}">${esc(r.name.slice(0,1))}</span><span><strong>${esc(r.name)}</strong><small>${r.kind==='group'?'群聊':'联系人'}</small></span></div><div class="meta"><span class="meta-label">最近执行时间</span><span class="meta-value">${date(r.at)}</span></div><div class="record-preview">${r.state==='help'?'<span class="state amber">需要本人处理</span> ':''}${esc(r.preview)}</div><div class="record-actions"><button class="btn small" data-action="chat" data-name="${esc(r.name)}">打开聊天</button><button class="expand" data-action="expand" data-id="${r.id}" aria-label="${opened?'收起':'展开'}${esc(r.name)}的执行记录" aria-expanded="${opened}">${iconChevron}</button></div></div><div class="record-detail">${r.state==='help'?`<div class="strip" style="border:0;border-radius:8px;margin-bottom:14px"><span>⚠ ${esc(r.reason)}</span><button class="btn small" data-action="resume" data-id="${r.id}">开启自动回复</button></div>`:''}<div class="detail-layout"><section class="summary-box" id="summary-${r.id}"><div class="summary-head"><strong class="summary-title">聊天总结</strong><div class="summary-row"><select id="range-${r.id}" aria-label="${esc(r.name)}的总结时间范围">${ranges}</select><button class="btn small tonal" data-action="summary" data-id="${r.id}">总结</button></div></div>${ui.summary[r.id]?`<div class="summary-result" role="status"><div class="summary-copy">${esc(ui.summary[r.id])}</div></div>`:''}</section><section class="history-panel"><div class="detail-heading"><strong>执行记录</strong><span>${r.messages.length} 条</span><span class="spacer"></span></div>${history}</section></div></div></article>`;
  }).join('');
  if(!list.length)html+='<div class="empty">暂无符合条件的自动回复记录。请调整筛选条件。</div>';
  html+=`</div><div class="pager"><button class="btn small" data-action="page" data-page="${ui.page-1}" ${ui.page===0?'disabled':''}>上一页</button><span>${ui.page+1} / ${totalPages}</span><button class="btn small" data-action="page" data-page="${ui.page+1}" ${ui.page+1>=totalPages?'disabled':''}>下一页</button></div></section>`;
  return html;
}
function renderSkip(){return '<section class="section"><div class="section-header"><div><h2>未回复记录 <span class="count">'+skips.length+'</span></h2><p>保留最近 50 次判断</p></div></div><table class="list-table"><thead><tr><th>联系人</th><th>时间</th><th>原因与来源</th><th>操作</th></tr></thead><tbody>'+(skips.length?skips.map(s=>'<tr><td data-label="联系人"><strong>'+esc(s.name)+'</strong></td><td data-label="时间">'+date(s.at)+'</td><td data-label="原因与来源">'+esc(s.source)+' · '+esc(s.reason)+'</td><td data-label="操作" class="action-cell"><button class="btn small" data-action="chat" data-name="'+esc(s.name)+'">打开聊天</button><button class="btn small" data-action="mark" data-id="'+s.id+'" '+(s.marked?'disabled':'')+'>'+(s.marked?'已标记':'标记为需回复')+'</button><button class="btn small danger" data-action="delete" data-type="skip" data-id="'+s.id+'">删除记录</button></td></tr>').join(''):'<tr><td colspan="4" class="empty">暂无未回复记录</td></tr>')+'</tbody></table></section>'}
function renderProactive(){const data=proactive.concat(ui.olderProactive?olderProactive:[]);const shown=data.filter(r=>matching(r.task+' '+r.name+' '+r.text,r.at,'person',['sent','done'].includes(r.status)?'sent':['failed','not-sent'].includes(r.status)?'help':''));let html='<section class="section"><div class="section-header"><div><h2>主动聊天 <span class="count">'+shown.length+'</span></h2><p>每次执行单独记录 · 删除任务后仍保留历史</p></div></div><div class="section-body">';html+=shown.length?shown.map(r=>'<div class="taskrow"><div><span class="meta-label">任务</span><strong>'+esc(r.task)+'</strong></div><div><span class="meta-label">联系人</span><strong>'+esc(r.name)+'</strong></div><div><span class="meta-label">最近执行时间</span><strong>'+date(r.at)+'</strong></div><div class="content-cell"><span class="meta-label">本次执行内容</span><span class="state '+statusClass(r.status)+'">'+statusLabel(r.status)+'</span><p class="text">'+esc(r.text||'无可展示正文')+'</p>'+(r.reason?'<p class="help">'+esc(r.reason)+'</p>':'')+'</div><div class="actions">'+'<button class="btn small" data-action="chat" data-name="'+esc(r.name)+'">打开聊天</button><button class="btn small danger" data-action="delete" data-type="proactive" data-id="'+r.id+'">删除记录</button></div></div>').join(''):'<div class="empty">已加载范围内暂无符合条件的主动聊天记录</div>';html+='</div><div class="foot"><span>已加载 '+data.length+' 条，当前筛选显示 '+shown.length+' 条</span>'+(ui.olderProactive?'<span>当前加载范围已到末尾</span>':'<button class="btn small" data-action="olderProactive">加载更早记录</button>')+'</div></section>';return html}
function renderErrors(){const data=errors.concat(ui.olderErrors?olderErrors:[]);if(!data.length)return '';return '<details class="disclosure" id="errorDetails" '+(ui.errorOpen?'open':'')+'><summary><span class="state red">!</span><strong>最近异常（'+data.length+'）</strong><span>按时间查看执行问题</span><span class="spacer"></span><button type="button" class="btn small danger" data-action="clearErrors">清空</button><i class="expand">'+iconChevron+'</i></summary><div class="errors-body">'+data.map(e=>'<div class="error-row"><time>'+date(e.at)+'</time><span>'+esc(e.text)+'</span></div>').join('')+'<div class="error-footer"><span>已加载 '+data.length+' / '+(errors.length+olderErrors.length)+' 条</span>'+(ui.olderErrors?'<span>已全部加载</span>':'<button class="btn small" data-action="olderErrors">加载更早异常</button>')+'</div></div></details>'}
function render(){
  hideContextMenu();
  const replyTab=ui.tab==='reply';
  $('#replyCount').textContent=replies.length;
  $('#proactiveCount').textContent=proactive.length+(ui.olderProactive?olderProactive.length:0);
  document.querySelectorAll('[data-tab]').forEach(b=>{const yes=b.dataset.tab===ui.tab;b.classList.toggle('active',yes);b.setAttribute('aria-selected',yes)});
  $('#live').innerHTML='<div class="live-strip"><i class="pulse"></i><strong>实时状态</strong><span>林晓：模型生成中…</span><span class="spacer"></span><button class="btn quiet" data-action="live">查看详情 →</button></div>';
  $('#records').innerHTML=replyTab?renderReply():renderProactive();
  $('#skip').innerHTML=replyTab?renderSkip():'';
  $('#errors').innerHTML=renderErrors();
  const d=$('#errorDetails');if(d)d.addEventListener('toggle',()=>ui.errorOpen=d.open);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action],[data-tab],[data-nav]');
  if(!e.target.closest('#contextMenu'))hideContextMenu();
  if(!b)return;
  if(b.dataset.nav){toast('这是执行记录的独立演示稿，其他页面未在此稿中制作');return}
  if(b.dataset.tab){ui.tab=b.dataset.tab;ui.page=0;render();return}
  const a=b.dataset.action;
  if(a==='expand'){ui.expanded.has(b.dataset.id)?ui.expanded.delete(b.dataset.id):ui.expanded.add(b.dataset.id);render()}
  else if(a==='chat')openChat(b.dataset.name);
  else if(a==='resume')resumeReply(b.dataset.id);
  else if(a==='live')modal('实时状态','林晓：模型生成中…\n演示稿展示当前处理状态，不连接真实微信或 AI 服务。',[{label:'知道了',primary:true}]);
  else if(a==='delete')confirmDelete(b.dataset.type,b.dataset.id);
  else if(a==='delete-context'){const id=$('#contextMenu').dataset.id;hideContextMenu();if(id)confirmDelete('reply',id)}
  else if(a==='page'){ui.page=Number(b.dataset.page);render()}
  else if(a==='olderProactive'){ui.olderProactive=true;render();toast('已加载更早记录')}
  else if(a==='olderErrors'){ui.olderErrors=true;ui.errorOpen=true;render();toast('已加载更早异常')}
  else if(a==='mark')modal('标记为需回复','这条消息会暂存，下一次自动回复前先总结该消息。演示稿不会写入真实数据。',[{label:'取消'},{label:'演示：确认标记',primary:true,onClick:()=>{const row=skips.find(x=>x.id===b.dataset.id);if(row)row.marked=true;render();toast('已演示标记为需回复')}}]);
  else if(a==='clearErrors'){e.preventDefault();e.stopPropagation();modal('清空最近异常？','删除后无法恢复；不会影响聊天内容和其他运行记录。',[{label:'取消'},{label:'清空异常',danger:true,onClick:()=>{errors.length=0;olderErrors.length=0;render();toast('异常记录已从演示数据中清空')}}])}
  else if(a==='summary'){const r=replies.find(x=>x.id===b.dataset.id);const range=$('#range-'+r.id)?.value||'takeover';ui.summaryRange[r.id]=range;const label={takeover:'本次接管',all:'全部',day:'近一天',week:'近一周',month:'近一月'}[range];const sample=r.id==='lin'?'近期自动回复记录主要涉及周五见面安排与资料整理。消息中提到周五下午三点、上次的咖啡馆，以及资料已收到并会继续整理。\n\n待跟进：见面前再次确认具体地址；继续核对资料中的细节。':`最近的自动回复记录为：“${r.messages[0]?.text||'暂无可展示正文'}”。当前可读取内容较少，无法确认更多安排。`;ui.summary[r.id]=sample+'\n\n证据范围：'+label+'；此结果为演示内容，未调用 AI 服务。';render();$('#summary-'+r.id+' .summary-result')?.scrollIntoView({behavior:'smooth',block:'nearest'});toast('已生成演示总结')}
});
document.addEventListener('contextmenu',e=>{const row=e.target.closest('.message[data-record-id]');if(!row){hideContextMenu();return}e.preventDefault();openContextMenu(row.dataset.recordId,e.clientX,e.clientY)});
let longPressTimer=0,longPressStart=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const row=e.target.closest('.message[data-record-id]');if(!row)return;longPressStart={x:e.clientX,y:e.clientY};longPressTimer=setTimeout(()=>openContextMenu(row.dataset.recordId,e.clientX,e.clientY),580)});
document.addEventListener('pointermove',e=>{if(longPressStart&&Math.hypot(e.clientX-longPressStart.x,e.clientY-longPressStart.y)>9){clearTimeout(longPressTimer);longPressStart=null}});
for(const type of ['pointerup','pointercancel'])document.addEventListener(type,()=>{clearTimeout(longPressTimer);longPressStart=null});
document.addEventListener('keydown',e=>{if((e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10'))&&e.target.matches('.message[data-record-id]')){e.preventDefault();const row=e.target,rect=row.getBoundingClientRect();openContextMenu(row.dataset.recordId,rect.right-105,rect.top+22)}else if(e.key==='Escape'){hideContextMenu();closeModal()}});

const fxMemoryTypes=[['name','姓名'],['phone','手机号码'],['birthday','生日'],['date','其他重要日期'],['school','学校'],['household','户籍地'],['residence','居住地址'],['workplace','工作地点'],['employer','工作单位'],['shipping','收货地址'],['other','其他聊天记忆']];

function fxMemoryStore(id){
  if(fx.memoryStores[id])return fx.memoryStores[id];
  const c=fxContact(id),now=Date.now(),legacy=c?.memory||[];
  let saved=legacy.map((m,i)=>({id:'old'+i,field:'other',text:m.text,recordedAt:now-86400000}));

  return fx.memoryStores[id]={saved,editor:fxMemoryClone(saved),pending:null,pendingSource:'learn',history:[],dirty:false};
}
function fxMemorySample(id){

  return [{id:'new1',field:'other',text:'约定周五 15:00 见面，地点尚未确定。',recordedAt:now},{id:'new2',field:'date',text:'相识纪念日：9月12日',calendar:'solar',recordedAt:now},{id:'new3',field:'employer',text:'目前在晨光设计工作',recordedAt:now}];
}
function fxMemorySync(id){
  const c=fxContact(id),store=fxMemoryStore(id);if(!c)return;
  c.memory=store.saved.map(e=>({type:fxMemoryFieldLabel(e.field),text:e.text}));
  if(fx.drafts[id])fx.drafts[id].memory=c.memory.map(m=>({...m}));
}

  if(e.target.name==='analysisRequest'){fx.analysis.request=e.target.value;fx.analysis.preset=''}
  if(e.target.name==='analysisFrom')fx.analysis.from=e.target.value;
  if(e.target.name==='analysisTo')fx.analysis.to=e.target.value;
  if(e.target.name==='defaultSummary'){fx.defaultDraft=e.target.value;const badge=$('#fxDefaultSaveState');if(badge){badge.textContent='待保存';badge.className='state blue'}}
  if(e.target.name==='pasteText')fx.defaultPasteDraft=e.target.value;
  if(e.target.name==='defaultFrom')fx.defaultFrom=e.target.value;
  if(e.target.name==='defaultTo')fx.defaultTo=e.target.value;
  if(e.target.id==='fxDefaultSearch'){fx.defaultSearch=e.target.value;document.querySelectorAll('.fx-default-person').forEach(row=>row.hidden=!row.dataset.name.toLowerCase().includes(fx.defaultSearch.toLowerCase()))}
  if(e.target.id==='fxObjectSearch'){fx.search=e.target.value;document.querySelectorAll('.fx-object-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(fx.search.toLowerCase()))}
  if(e.target.id==='fxAnalysisSearch'){fx.analysis.search=e.target.value;document.querySelectorAll('#fxAnalysisContacts [data-name]').forEach(row=>row.hidden=!row.dataset.name.toLowerCase().includes(fx.analysis.search.toLowerCase()))}
  if(e.target.id==='fxLearnSearch'){fx.learn.search=e.target.value;document.querySelectorAll('#fxLearnChoices [data-name]').forEach(row=>row.hidden=!row.dataset.name.toLowerCase().includes(fx.learn.search.toLowerCase()))}
});
document.addEventListener('change',e=>{
  if(e.target.matches('[data-fm-field]')){fxMemoryCapture();fx.memoryPage.field=['workplace','employer'].includes(e.target.value)?'work':e.target.value;fxRender()}
  if(e.target.closest('#fxObjectForm')){if(e.target.name==='realtime'&&e.target.checked){modal('开启 AI 实时回复？','群聊消息多时会增加模型调用；自动发言过于频繁也可能影响账号。请确认后再开启。',[{label:'取消',onClick:()=>{e.target.checked=false;fxCaptureObject()}},{label:'确认开启',primary:true,onClick:fxCaptureObject}])}else if(e.target.name==='enabled'){fxCaptureObject();fxRender();const note=$('#fxDirty');if(note)note.textContent='有未保存的修改'}else fxCaptureObject()}
  if(e.target.closest('#fxTaskForm')){fxCaptureTask();if(e.target.name==='type'&&!fx.taskDraft.goal.trim())fx.taskDraft.goal=fxTaskTypes.find(x=>x[0]===fx.taskDraft.type)?.[2]||'';if(['cycle','mode','type','contacts'].includes(e.target.name))fxRender()}
  if(e.target.name==='analysisContact'){e.target.checked?fx.analysis.selected.add(e.target.value):fx.analysis.selected.delete(e.target.value);fx.analysis.request=$('#fxAnalysisForm [name=analysisRequest]')?.value||fx.analysis.request;fxRender()}
  if(e.target.id==='fxMobileKind'){if(fx.page==='memory')fxMemoryCapture();else fxCaptureObject();fx.kind=e.target.value;fx.selected=fx.contacts.find(c=>c.kind===fx.kind)?.id||'';fx.memoryPage.contact=fx.selected;fx.memoryPage.field='name';fx.search='';fxRender()}
  if(e.target.id==='fxMobileContact'){if(fx.page==='memory')fxMemoryCapture();else fxCaptureObject();fx.selected=e.target.value;fx.memoryPage.contact=fx.selected;fx.memoryPage.field='name';fxRender()}
  if(e.target.name==='learnContact'){e.target.checked?fx.learn.selected.add(e.target.value):fx.learn.selected.delete(e.target.value);fxRender()}
  if(e.target.name==='learnTarget'){fx.learn.target=e.target.value;fxRender()}
  if(e.target.id==='fxLearnFrom')fx.learn.from=e.target.value;
  if(e.target.id==='fxLearnTo')fx.learn.to=e.target.value;
  if(e.target.name==='defaultContact'){e.target.checked?fx.defaultSelected.add(e.target.value):fx.defaultSelected.delete(e.target.value);const count=$('.fx-default-count');if(count)count.textContent=`已选 ${fx.defaultSelected.size} 位`}
  if(e.target.name==='perspective')fx.defaultPerspective=e.target.value;
  if(e.target.name==='waitEnabled')$('#fxWaitMinutes').hidden=!e.target.checked;
  if(e.target.id==='fxModelChoice'&&e.target.value)$('#fxModelForm [name=model]').value=e.target.value;
});
document.addEventListener('toggle',e=>{if(e.target.matches('#fxObjectForm .fx-fold')&&e.target.textContent.includes('聊天记忆'))fx.memoryOpen=e.target.open},true);
document.addEventListener('submit',e=>{
  const f=e.target;if(!f.id?.startsWith('fx'))return;e.preventDefault();
  if(f.id==='fxObjectForm'){fxCaptureObject();const c=fxContact(f.dataset.contact),d=fxDraft(c);if(d.maxRounds<1||d.maxRounds>2000){toast('连续自动回复上限为 1–2000');return}Object.assign(c,d,{memory:d.memory.filter(m=>m.text.trim())});delete fx.drafts[c.id];fxRender();toast('当前对象设置已保存')}
  else if(f.id==='fxTaskForm'){fxCaptureTask();const d=fx.taskDraft;if(!d.name.trim()||!d.goal.trim()||!d.contacts.length){toast('请填写任务名称、聊天目标并选择联系人');return}if(d.id){Object.assign(fx.tasks.find(t=>t.id===d.id),d)}else fx.tasks.unshift({...d,id:'t'+Date.now(),status:'running',last:'尚未执行'});fx.taskEditing=false;fxRender();toast('演示任务已保存')}
  else if(f.id==='fxAnalysisForm'){const a=fx.analysis;a.request=f.elements.analysisRequest.value;a.from=f.elements.analysisFrom?.value||'';a.to=f.elements.analysisTo?.value||'';if(!a.selected.size){toast('请先选择联系人');return}if(a.range==='custom'&&(!a.from||!a.to||a.from>a.to)){toast('请选择有效的分析日期范围');return}a.activeReport=0;const label={all:'全部',day:'近一天',week:'近一周',month:'近一月',custom:`${a.from} 至 ${a.to}`}[a.range];a.reports=[...a.selected].map(id=>{const c=fxContact(id);return{id,name:c.name,range:label,count:48,body:`主要话题\n${c.name}近期主要讨论时间安排与资料交接。\n\n已达成的约定\n周五下午三点见面。\n\n待跟进事项\n见面地点仍需确认。`}});for(const r of a.reports)a.history.unshift({...r,id:'h'+Date.now()+r.id,at:'2026-09-25 10:00'});fxRender();$('#fxReportOutput')?.scrollIntoView({behavior:'smooth',block:'start'});toast('演示分析报告已生成')}
  else if(f.id==='fxSettingsForm'){const v=new FormData(f);fx.settings={master:v.has('master'),acknowledgeAI:v.has('acknowledgeAI'),waitEnabled:v.has('waitEnabled'),waitMinutes:Number(v.get('waitMinutes')||5)};fxRender();toast('演示通用设置已保存')}
  else if(f.id==='fxModelForm'){const v=new FormData(f);if(!v.has('consent')){toast('请先勾选模型服务授权');return}const model={id:fx.modelEdit==='new'?'m'+Date.now():fx.modelEdit,model:String(v.get('model')||''),baseUrl:String(v.get('baseUrl')||''),protocol:String(v.get('protocol')||'openai'),timeout:Number(v.get('timeout')||60),tested:false};if(!model.model||!model.baseUrl){toast('请填写模型名称和服务地址');return}const i=fx.models.findIndex(x=>x.id===model.id);if(i>=0)fx.models[i]=model;else{fx.models.push(model);if(fx.models.length===1){fx.assignments.chat=model.id;fx.assignments.learningAnalysis=model.id}}fx.modelEdit=null;fx.modelForm=null;fxRender();toast('演示模型已保存；连接状态仍需真实环境测试')}
  else if(f.id==='fxDefaultForm'){fx.defaultStyle=f.elements.defaultSummary.value;fx.defaultDraft=null;fx.contacts.filter(c=>c.style==='default').forEach(c=>c.summary=fx.defaultStyle);fxRender();toast('演示默认风格已保存')}
  else if(f.id==='fxPasteForm'){if(!f.elements.pasteText.value.trim()){toast('请先粘贴聊天内容');return}fx.defaultDraft='基于粘贴聊天的演示结果：表达简洁自然，回应有温度，未确认的事实不自行补充。';fxRender();toast('已生成演示风格，请确认并保存')}
});
fxRender();
</script>
</body>
</html>
