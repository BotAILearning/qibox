 <div class="modal-mask" id="modal"><div class="modal"><div class="modal-head"><h2>新建任务</h2><button class="close" id="closeModal">×</button></div><div class="modal-body"><div class="field"><label>选择联系人</label><div class="contact-picker"><div class="picker-top"><span style="color:var(--muted)">⌕</span><input class="picker-search" id="peopleSearch" placeholder="搜索姓名或关系"><button id="selectAllPeople">全选</button></div><div class="picker-summary"><span>从微信联系人中选择</span><b id="selectedCount">已选 2 人</b></div><div class="people" id="people"></div></div></div><div class="field"><label>聊天目标</label><textarea rows="3" placeholder="例如：自然问候近况，询问周末是否有空…"></textarea></div><div class="field"><label>其他要求 <span style="font-weight:400;color:var(--muted)">（选填）</span></label><textarea rows="2" placeholder="例如：称呼对方小名；语气轻松；不要提及工作压力…"></textarea><div class="field-hint">可补充称呼、语气、禁用话题或必须提到的信息。</div></div><div class="field"><label>执行周期</label><select id="scheduleType"><option>立即执行一次</option><option>每天执行</option><option>每个工作日执行</option><option>每周执行</option><option>自定义周期</option></select></div><div class="field"><label>执行时间方式</label><div class="time-options"><label class="time-card on"><input type="radio" name="timeMode" value="fixed" checked><b>固定时间</b><small>例如每天 14:40 执行</small></label><label class="time-card"><input type="radio" name="timeMode" value="fuzzy"><b>模糊时间</b><small>在时间段内随机选择，每次时间不固定</small></label></div><div class="fuzzy-wrap" id="fuzzyWrap" style="display:none"><div class="range-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="field" style="margin:0"><span style="font-size:10px;color:var(--muted)">开始时间</span><input type="time" value="18:00" /></label><label class="field" style="margin:0"><span style="font-size:10px;color:var(--muted)">结束时间</span><input type="time" value="21:00" /></label></div><div class="field-hint" style="margin-top:8px">每个周期会在此时间段内随机选择发送时刻；本次执行后再确定下一次时间。</div></div><div id="fixedWrap" style="margin-top:8px"><input type="time" value="14:40" /></div></div><div class="detail-note">固定时间是明确时刻；模糊时间是时间段内随机发送，周期内每次时间不固定。</div></div><div class="modal-foot"><button class="btn ghost" id="cancelModal">取消</button><button class="btn primary" id="createDemo">新建任务</button></div></div></div>

<script>
const people=[{name:'陈小雨',note:'朋友 · 在线',av:'av1',state:'done',label:'已完成',time:'13:12',draft:'春天到了，最近过得怎么样？周末有空一起喝杯咖啡吗？'},{name:'林一',note:'同事 · 在线',av:'av2',state:'running',label:'执行中',time:'即将执行',draft:'最近项目进展还顺利吗？有空的话想和你同步一下下周的安排。'},{name:'周末',note:'朋友 · 2 小时前在线',av:'av3',state:'paused',label:'已暂停',time:'已暂停 13:46',draft:'最近天气很舒服，想问问你周末有没有什么安排？'},{name:'许知远',note:'同事 · 在线',av:'av4',state:'running',label:'生成中',time:'预计 14:40',draft:'正在根据你设置的目标生成合适的开场…'},{name:'王可',note:'朋友 · 在线',av:'av1',state:'done',label:'已完成',time:'12:40',draft:'好久没聊，最近还好吗？'},{name:'赵宁',note:'同事 · 离线',av:'av2',state:'done',label:'已完成',time:'11:58',draft:'上次提到的资料我整理好了，有需要我发你。'},{name:'妈妈',note:'家人 · 在线',av:'av3',state:'running',label:'执行中',time:'即将执行',draft:'今天降温了，记得多穿一件。晚上想吃什么？'}];
const contactMeta={'陈小雨':{type:'learned',label:'已学习'},'林一':{type:'reply',label:'已设置自动回复'},'周末':{type:'none',label:'未配置'},'许知远':{type:'learned',label:'已学习'},'王可':{type:'reply',label:'已设置自动回复'},'赵宁':{type:'none',label:'未配置'},'妈妈':{type:'learned',label:'已学习'}};
const orderedPeople=[...people].sort((a,b)=>({learned:0,reply:1,none:2}[contactMeta[a.name]?.type||'none']-({learned:0,reply:1,none:2}[contactMeta[b.name]?.type||'none'])));
const contactTag=p=>{const m=contactMeta[p.name]||{type:'none',label:'未配置'};return `<span class="contact-tag ${m.type}">${m.label}</span>`};
const tasks=[{name:'春日问候计划',people:['陈小雨','林一','周末'],goal:'自然问候近况，保持轻松联系',content:'春天到了，最近过得怎么样？',cycle:'每天 14:00–18:00 随机',status:'running',statusText:'执行中',recent:'今天 16:12'},{name:'项目跟进',people:['许知远','赵宁'],goal:'跟进项目进度，提醒同步安排',content:'最近项目进展还顺利吗？',cycle:'每周一 09:30',status:'running',statusText:'执行中',recent:'今天 09:30'},{name:'周末邀约',people:['周末','王可'],goal:'询问周末安排，发起轻量邀约',content:'周末有空一起喝杯咖啡吗？',cycle:'周五–周日 18:00–21:00 随机',status:'paused',statusText:'已暂停',recent:'昨天 19:02'},{name:'家人问候',people:['妈妈'],goal:'关注家人近况，发送日常问候',content:'今天降温了，记得多穿一件。',cycle:'每天 19:00',status:'ended',statusText:'已结束',recent:'今天 19:00'}];
tasks.push({name:'晚间近况',people:['林一'],goal:'发送近况问候，保持联系',content:'最近还好吗？有空聊聊。',cycle:'每天 20:00–22:00 随机',status:'failed',statusText:'执行失败',recent:'今天 20:18'});
let selected=1, filter='all', pausedAll=false;
const queue=document.getElementById('queue'),detail=document.getElementById('detail');
function stateClass(s){return s==='done'?'done':s==='ready'?'ready':s==='paused'?'paused':s==='running'?'running':'failed'}
let editingTask=null;
function showNewTaskPage(){contentRoot.innerHTML=`<div class="new-task-page"><div class="new-task-head"><button class="btn ghost" id="backTaskList">← 返回任务列表</button><div><h1>新建任务</h1><p>设置联系人和执行规则，任务建立后会自动执行。</p></div><div class="spacer"></div></div><div class="form-grid"><div class="form-stack"><section class="form-card"><h2>选择联系人</h2><div class="card-hint">已学习和已设置自动回复的联系人会优先显示。</div><div class="contact-picker"><div class="picker-top"><span style="color:var(--muted)">⌕</span><input class="picker-search" id="pagePeopleSearch" placeholder="搜索姓名或关系"><button id="pageSelectAll">全选</button></div><div class="picker-summary"><span>从微信联系人中选择</span><b id="pageSelectedCount">已选 2 人</b></div><div class="people" id="pagePeople"></div></div></section><section class="form-card"><h2>聊天目标</h2><div class="card-hint">告诉 AI 这次联系想达成什么。</div><textarea id="pageGoal" rows="4" placeholder="例如：自然问候近况，询问周末是否有空…"></textarea></section><section class="form-card"><h2>其他要求 <span style="font-size:11px;color:var(--muted);font-weight:400">（选填）</span></h2><div class="card-hint">可补充称呼、语气、禁用话题或必须提到的信息。</div><textarea id="pageRequirement" rows="3" placeholder="例如：称呼对方小名；语气轻松；不要提及工作压力…"></textarea></section><section class="form-card"><h2>执行安排</h2><div class="field"><label>执行周期</label><select id="pageSchedule"><option>立即执行一次</option><option>每天执行</option><option>每个工作日执行</option><option>每周执行</option><option>自定义周期</option></select></div><div class="field"><label>执行时间方式</label><div class="time-options"><label class="time-card on"><input type="radio" name="pageTimeMode" value="fixed" checked><b>固定时间</b><small>按明确时刻执行</small></label><label class="time-card"><input type="radio" name="pageTimeMode" value="fuzzy"><b>模糊时间</b><small>在时间段内随机选择</small></label></div><div id="pageFuzzy" class="fuzzy-wrap" style="display:none"><div class="range-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="field" style="margin:0"><span style="font-size:10px;color:var(--muted)">开始时间</span><input type="time" value="18:00"></label><label class="field" style="margin:0"><span style="font-size:10px;color:var(--muted)">结束时间</span><input type="time" value="21:00"></label></div><div class="field-hint" style="margin-top:8px">每个周期随机一次，本次执行后再确定下一次时间。</div></div><div id="pageFixed" style="margin-top:8px"><input type="time" value="14:40"></div><div class="time-mode-summary" id="pageTimeSummary"><b>当前策略：</b>按固定时刻执行，不会在周期内随机变动。</div></div></section></div><aside class="new-task-aside"><section class="form-card preview-card"><h2>任务预览</h2><div class="card-hint">建立后立即进入执行队列。</div><div class="preview-line"><span>联系人</span><b id="previewPeople">已选择 2 人</b></div><div class="preview-line"><span>执行周期</span><b id="previewCycle">立即执行一次 · 14:40</b></div><div class="preview-line"><span>执行规则</span><b>自动执行，可随时暂停或结束</b></div></section><button class="btn ghost" id="cancelNewTask">取消</button><button class="btn primary" id="submitNewTask">新建任务</button></aside></div></div>`;const cards=document.getElementById('pagePeople');cards.innerHTML=orderedPeople.map((p,i)=>`<label class="person-pick ${i<2?'on':''}" data-search="${p.name} ${p.note}"><input type="checkbox" ${i<2?'checked':''}><span class="avatar ${p.av}">${p.name.slice(0,1)}</span><span class="person-info"><b>${p.name}</b><small>${p.note}</small>${contactTag(p)}</span><span class="person-check"></span></label>`).join('');const refresh=()=>{const n=cards.querySelectorAll('.person-pick.on').length;document.getElementById('pageSelectedCount').textContent='已选 '+n+' 人';document.getElementById('previewPeople').textContent='已选择 '+n+' 人';document.getElementById('pageSelectAll').textContent=n===orderedPeople.length?'取消全选':'全选'};cards.querySelectorAll('.person-pick').forEach(c=>c.onclick=()=>{c.classList.toggle('on');c.querySelector('input').checked=c.classList.contains('on');refresh()});document.getElementById('pageSelectAll').onclick=()=>{const all=cards.querySelectorAll('.person-pick.on').length===orderedPeople.length;cards.querySelectorAll('.person-pic ne').onclick=()=>{p.state='done';p.label='已跳过';p.time='刚刚';toast('已跳过此联系人，不会执行');renderQueue();renderDetail()}}

const modal=document.getElementById('modal');document.getElementById('newTask').onclick=()=>{document.getElementById('people').innerHTML=orderedPeople.map((p,i)=>`<label class="person-pick ${i<2?'on':''}" data-person="${p.name}" data-search="${p.name} ${p.note}"><input type="checkbox" ${i<2?'checked':''}/><span class="avatar ${p.av}">${p.name.slice(0,1)}</span><span class="person-info"><b>${p.name}</b><small>${p.note} · 最近互动 ${i%2?'昨天':'今天'}</small>${contactTag(p)}</span><span class="person-check"></span></label>`).join('');modal.classList.add('show');const refreshCount=()=>{const n=document.querySelectorAll('#people .person-pick.on').length;document.getElementById('selectedCount').textContent='已选 '+n+' 人';document.getElementById('selectAllPeople').textContent=n===people.length?'取消全选':'全选'};document.querySelectorAll('#people .person-pick').forEach(card=>card.onclick=()=>{card.classList.toggle('on');card.querySelector('input').checked=card.classList.contains('on');refreshCount()});document.getElementById('selectAllPeople').onclick=()=>{const all=document.querySelectorAll('#people .person-pick.on').length===people.length;document.querySelectorAll('#people .person-pick').forEach(card=>{card.classList.toggle('on',!all);card.querySelector('input').checked=!all});refreshCount()};document.getElementById('peopleSearch').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('#people .person-pick').forEach(card=>card.style.display=card.dataset.search.toLowerCase().includes(q)?'flex':'none')};refreshCount();document.querySelectorAll('[name="timeMode"]').forEach(r=>r.onchange=()=>{const fuzzy=r.value==='fuzzy'&&r.checked;document.querySelectorAll('.time-card').forEach(c=>c.classList.toggle('on',c.querySelector('input').checked));document.getElementById('fuzzyWrap').style.display=fuzzy?'block':'none';document.getElementById('fixedWrap').style.display=fuzzy?'none':'block'})};document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');document.getElementById('cancelModal').onclick=()=>modal.classList.remove('show');document.getElementById('createDemo').onclick=()=>{modal.classList.remove('show');toast('任务已创建并开始自动执行')};
document.getElementById('createDemo').onclick=()=>{if(editingTask){editingTask.content=document.querySelectorAll('#modal textarea')[0].value.trim()||editingTask.content;editingTask.requirement=document.querySelectorAll('#modal textarea')[1].value.trim();editingTask.statusText=editingTask.status==='ended'?'已结束':editingTask.status==='paused'?'已暂停':'执行中';editingTask=null;document.querySelector('#modal .modal-head h2').textContent='新建任务';document.getElementById('createDemo').textContent='新建任务';modal.classList.remove('show');renderQueue();toast('任务已保存')}else{modal.classList.remove('show');toast('任务已创建并开始自动执行')}};
document.getElementById('newTask').onclick=()=>showNewTaskPage();
document.addEventListener('click',e=>{if(e.target.id==='submitNewTask'&&editingTask){editingTask.content=document.getElementById('pageGoal').value.trim()||editingTask.content;editingTask.requirement=document.getElementById('pageRequirement').value.trim();toast('任务已保存')}});
document.addEventListener('click',e=>{if(e.target.closest('#sidebarRecords')){showRecordsPage();return}const b=e.target.closest('.action-menu [data-act="records"]');if(!b)return;const cell=b.closest('.action-cell');const idx=+cell.querySelector('[data-task]').dataset.task;b.closest('.action-menu').remove();showRecordsPage(tasks[idx].name)});document.getElementById('closeRecords').onclick=()=>document.getElementById('recordModal').classList.remove('show');document.getElementById('closeRecordsFoot').onclick=()=>document.getElementById('recordModal').classList.remove('show');
document.getElementById('newTask').addEventListener('click',()=>{const fixedWrap=document.getElementById('fixedWrap');if(!document.getElementById('timeModeSummary'))fixedWrap.insertAdjacentHTML('afterend','<div class="time-mode-summary" id="timeModeSummary"></div>');const updateSummary=()=>{const fuzzy=document.querySelector('[name="timeMode"][value="fuzzy"]').checked;const summary=document.getElementById('timeModeSummary');summary.innerHTML=fuzzy?'<b>当前策略：</b>在设定时间段内随机选择发送时刻，本次执行后再确定下一次时间。':'<b>当前策略：</b>按固定时刻执行，不会在周期内随机变动。'};document.querySelectorAll('[name="timeMode"]').forEach(r=>r.addEventListener('change',updateSummary));updateSummary()});
function showRecordsOverviewPage(){setSidebarActive('records');const proactive=activityRecords.filter(r=>r.type==='proactive');const grouped={};activityRecords.filter(r=>r.type==='auto').forEach(r=>{(grouped[r.person] ||= []).push(r)});const autoGroups=Object.entries(grouped);contentRoot.innerHTML=`<div class="records-page"><div class="records-head"><div><h1>运行记录</h1><p>主动聊天和自动回复分别展示，按联系人查看自动回复的完整执行内容。</p></div><div class="spacer"></div></div><section class="record-block"><div class="record-block-head"><h2>主动聊天</h2><span>每一次主动发送单独记录</span></div><section class="panel task-table-panel"><table class="records-table"><thead><tr><th>任务</th><th>联系人</th><th>最近执行时间</th><th>本次发送内容</th><th>操作</th></tr></thead><tbody>${proactive.length?proactive.map(r=>`<tr><td><div class="task-name">${r.task}</div><span class="sub">主动聊天</span></td><td><span class="person-name">${r.person}</span></td><td><span class="muted">${r.time}</span></td><td><div class="send-content ${r.result==='执行失败'?'failed':''}">${r.content}</div></td><td><button class="open-chat" data-person="${r.person}">打开聊天</button></td></tr>`).join(''):'<tr><td colspan="5"><div class="record-empty">当前还没有主动聊天记录</div></td></tr>'}</tbody></table></section></section><section class="record-block"><div class="record-block-head"><h2>自动回复</h2><span>按联系人查看全部执行记录</span></div><section class="panel task-table-panel"><table class="records-table auto-records-table"><thead><tr><th>联系人</th><th>执行次数</th><th>最近执行时间</th><th>执行记录</th><th>操作</th></tr></thead><tbody>${autoGroups.length?autoGroups.map(([name,rows],i)=>`<tr class="auto-person-row"><td><div class="task-name">${name}</div><span class="sub">自动回复联系人</span></td><td><span class="count-badge">${rows.length} 次</span></td><td><span class="muted">${rows[0].time}</span></td><td><button class="record-expand" data-expand="${i}">展开执行记录</button></td><td><button class="open-chat" data-person="${name}">打开聊天</button></td></tr><tr class="auto-detail-row" data-detail="${i}" hidden><td colspan="5"><div class="auto-detail-title">${name} 的全部 AI 执行内容 <span>${rows.length} 条</span></div>${rows.map(r=>`<div class="auto-execution"><span class="muted">${r.time}</span><span>${r.content}</span><span class="result-pill ok">${r.result}</span><button class="open-chat" data-person="${name}">打开聊天</button></div>`).join('')}</td></tr>`).join(''):'<tr><td colspan="5"><div class="record-empty">当前还没有自动回复记录</div></td></tr>'}</tbody></table></section></section></div>`;document.querySelectorAll('.record-expand').forEach(b=>b.onclick=()=>{const detail=document.querySelector('[data-detail="'+b.dataset.expand+'"]');detail.hidden=!detail.hidden;b.textContent=detail.hidden?'展开执行记录':'收起执行记录'});document.querySelectorAll('.open-chat').forEach(b=>b.onclick=()=>toast('演示中：已打开与「'+b.dataset.person+'」的聊天'))}
const setSidebarActive=which=>{document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',which==='proactive'?i===1:which==='records'&&b.id==='sidebarRecords'))};
document.querySelectorAll('.nav button')[1].onclick=e=>{e.stopPropagation();setSidebarActive('proactive');window.location.reload()};
document.getElementById('sidebarRecords').onclick=e=>{e.stopPropagation();setSidebarActive('records');showRecordsPage()};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>el.classList.remove('show'),2200)}renderQueue();
</script>
</body>
