# UGOS 1.19 native desktop compatibility, installed by an administrator.
# Keep the generated read-only root and all existing application write mounts.
[Service]
BindReadOnlyPaths=
BindReadOnlyPaths=/lib -/lib32 -/lib64 /sys /dev
BindReadOnlyPaths=/etc/resolv.conf /etc/ssl/certs /etc/localtime /etc/timezone
BindReadOnlyPaths=/etc/machine-id /run/ugreen.pub
BindReadOnlyPaths=/var/packages/com.bot.qibox
BindReadOnlyPaths=/bin /sbin /usr/bin /usr/sbin
BindReadOnlyPaths=/var/packages/com.bot.qibox/data/runtime/usr/share/X11/xkb:/usr/share/X11/xkb
BindPaths=/var/packages/com.bot.qibox/data /var/packages/com.bot.qibox/cache /var/packages/com.bot.qibox/log
BindPaths=-/var/packages/com.bot.qibox/shared
ProtectProc=invisible
ReadOnlyPaths=/proc
TemporaryFileSystem=/dev/shm:rw,nosuid,nodev,noexec,size=256m,mode=1777
